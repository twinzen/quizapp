<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Quiz</title>
  <link rel="stylesheet" href="style.css?v=2" />
</head>
<body>
  <div class="page">
    <a class="back-link" href="index.html">← Back to Quiz List</a>
    <div id="quiz-root">
      <div class="loading">Loading questions…</div>
    </div>
  </div>

  <script src="app.js?v=4"></script>
  <script>
    const OPTION_COLOR_CYCLE = [
      "var(--pink)",
      "var(--teal)",
      "var(--purple)",
      "var(--yellow)",
      "var(--sky)",
    ];
    function optionColor(index) {
      return OPTION_COLOR_CYCLE[index % OPTION_COLOR_CYCLE.length];
    }

    const params = new URLSearchParams(window.location.search);
    const file = params.get("file");

    let questions = [];
    let current = 0;
    let score = 0;
    let answered = false;
    let quizName = "";
    let quizCategory = "";

    // Quizzes in these categories get a scratch whiteboard toggle.
    const WHITEBOARD_CATEGORIES = ["Math", "Problem Solving"];
    function whiteboardEnabled() {
      if (quizCategory) return WHITEBOARD_CATEGORIES.includes(quizCategory);
      return /^QUIZ_(Math|Problem_Solving)-/.test(file || "");
    }

    const root = document.getElementById("quiz-root");

    async function init() {
      if (!file) {
        root.innerHTML = `<div class="error-state">No quiz file specified. Please choose a quiz from the quiz list page.</div>`;
        return;
      }
      let bank;
      try {
        bank = await fetchQuizBank(file);
      } catch (err) {
        root.innerHTML = `<div class="error-state">
          Failed to load question bank "${escapeHtml(file)}".<br />
          Make sure the file exists and this page is opened via a local server.
        </div>`;
        return;
      }
      if (!bank.length) {
        root.innerHTML = `<div class="error-state">This quiz has no questions.</div>`;
        return;
      }

      let numberOfQuestions = null;
      try {
        const res = await fetch("quizzes.json", { cache: "no-store" });
        if (res.ok) {
          const manifest = await res.json();
          const entry = manifest.find((q) => q.file === file);
          if (entry) {
            numberOfQuestions = entry.number_of_questions;
            quizName = entry.name || "";
            quizCategory = entry.category || "";
          }
        }
      } catch (err) {
        // Non-fatal: fall back to using the full question bank.
      }
      if (!quizName) quizName = quizDisplayNameFromFile(file);

      questions = pickRandomQuestions(bank, numberOfQuestions);
      renderQuestion();
    }

    function renderQuestion() {
      answered = false;
      const q = questions[current];
      const total = questions.length;
      const { figure, text: questionText } = extractFigure(q.question);
      const { subtitle, main } = splitQuestion(questionText);
      const progressPct = Math.round((current / total) * 100);
      // Shuffle option order on every render. data-letter keeps the original
      // letter (used for scoring/feedback); the badge shows the display position.
      const originalLetters = q.optionLetters || Object.keys(q.options);
      const shuffledLetters = shuffle(originalLetters);

      root.innerHTML = `
        <div class="quiz-top">
          <div class="progress-label">Question ${current + 1} / ${total}</div>
          <div class="score-badge">Score: ${score}</div>
        </div>
        <div class="progress-track">
          <div class="progress-fill" style="width:${progressPct}%"></div>
        </div>

        <div class="question-card">
          <div class="q-tag">💡 Q.${current + 1}</div>
          ${subtitle ? `<div class="q-subtitle">${renderInline(subtitle)}</div>` : ""}
          ${figure ? `<div class="q-figure"><img src="${escapeHtml(figure).replace(/"/g, "&quot;")}" alt="Diagram for question ${current + 1}" /></div>` : ""}
          <p class="q-main">${renderInline(main)}</p>
        </div>

        <div class="answer-row">
          <span id="answer-hint">👆 Choose one answer:</span>
          ${whiteboardEnabled() ? `
            <button type="button" class="wb-toggle" id="wb-toggle">✏️ Whiteboard</button>
          ` : ""}
        </div>

        <div class="options-grid" id="options-grid">
          ${shuffledLetters.map((letter, i) => `
            <div class="option" data-letter="${letter}" style="--opt-color:${optionColor(i)}">
              <div class="badge">${originalLetters[i]}</div>
              <div class="option-text">${renderInline(q.options[letter])}</div>
            </div>
          `).join("")}
        </div>

        ${whiteboardEnabled() ? `
          <div class="whiteboard" id="whiteboard" hidden>
            <canvas class="wb-canvas" id="wb-canvas"></canvas>
            <button type="button" class="wb-clear" id="wb-clear">🧽 Clear</button>
          </div>
        ` : ""}

        <div id="explanation-box"></div>

        <div class="next-row">
          <button class="next-btn" id="next-btn" disabled>
            ${current === total - 1 ? "Finish Quiz" : "Next Question"}
          </button>
        </div>
      `;

      document.querySelectorAll(".option").forEach((el) => {
        el.addEventListener("click", () => selectAnswer(el.dataset.letter));
      });
      document.getElementById("next-btn").addEventListener("click", nextQuestion);
      if (whiteboardEnabled()) setupWhiteboard();
    }

    // The whiteboard is rebuilt with each question, so it always starts blank.
    function setupWhiteboard() {
      const toggle = document.getElementById("wb-toggle");
      const board = document.getElementById("whiteboard");
      const canvas = document.getElementById("wb-canvas");
      const grid = document.getElementById("options-grid");
      const hint = document.getElementById("answer-hint");
      const ctx = canvas.getContext("2d");
      let drawing = false;
      let last = null;

      function applyPenStyle() {
        ctx.lineCap = "round";
        ctx.lineJoin = "round";
        ctx.lineWidth = 3;
        ctx.strokeStyle = "#1f2937";
      }

      // Match the canvas pixels to its on-screen size, keeping any drawing.
      function resizeCanvas() {
        const rect = canvas.getBoundingClientRect();
        if (!rect.width) return;
        const dpr = window.devicePixelRatio || 1;
        const w = Math.round(rect.width * dpr);
        const h = Math.round(rect.height * dpr);
        if (canvas.width === w && canvas.height === h) return;
        let snapshot = null;
        if (canvas.width && canvas.height) {
          snapshot = document.createElement("canvas");
          snapshot.width = canvas.width;
          snapshot.height = canvas.height;
          snapshot.getContext("2d").drawImage(canvas, 0, 0);
        }
        canvas.width = w;
        canvas.height = h;
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        if (snapshot) ctx.drawImage(snapshot, 0, 0, rect.width, rect.height);
        applyPenStyle();
      }

      function point(e) {
        const rect = canvas.getBoundingClientRect();
        return { x: e.clientX - rect.left, y: e.clientY - rect.top };
      }

      canvas.addEventListener("pointerdown", (e) => {
        e.preventDefault();
        canvas.setPointerCapture(e.pointerId);
        drawing = true;
        last = point(e);
        // Draw a dot so single taps leave a mark.
        ctx.beginPath();
        ctx.arc(last.x, last.y, ctx.lineWidth / 2, 0, Math.PI * 2);
        ctx.fillStyle = ctx.strokeStyle;
        ctx.fill();
      });
      canvas.addEventListener("pointermove", (e) => {
        if (!drawing) return;
        const p = point(e);
        ctx.beginPath();
        ctx.moveTo(last.x, last.y);
        ctx.lineTo(p.x, p.y);
        ctx.stroke();
        last = p;
      });
      const stop = () => { drawing = false; last = null; };
      canvas.addEventListener("pointerup", stop);
      canvas.addEventListener("pointercancel", stop);

      document.getElementById("wb-clear").addEventListener("click", () => {
        ctx.save();
        ctx.setTransform(1, 0, 0, 1, 0, 0);
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        ctx.restore();
      });

      toggle.addEventListener("click", () => {
        const showBoard = board.hidden;
        board.hidden = !showBoard;
        grid.hidden = showBoard;
        toggle.classList.toggle("active", showBoard);
        toggle.textContent = showBoard ? "🔤 Answers" : "✏️ Whiteboard";
        hint.textContent = showBoard ? "✏️ Work it out here:" : "👆 Choose one answer:";
        if (showBoard) resizeCanvas();
      });

      window.onresize = () => { if (!board.hidden) resizeCanvas(); };
    }

    function selectAnswer(letter) {
      if (answered) return;
      answered = true;
      const q = questions[current];
      const correct = q.answer;

      document.querySelectorAll(".option").forEach((el) => {
        el.classList.add("disabled");
        const l = el.dataset.letter;
        if (l === correct) {
          el.insertAdjacentHTML("beforeend", `<div class="correct-badge">✓ Correct</div>`);
        } else if (l === letter) {
          el.classList.add("incorrect");
        }
      });

      if (letter === correct) {
        score++;
        document.querySelector(".score-badge").textContent = `Score: ${score}`;
      }

      let explanationHtml = "";
      if (letter !== correct && q.feedback && q.feedback[letter]) {
        explanationHtml += `
          <div class="explanation-card feedback-card">
            <div class="explanation-label">❌ "${escapeHtml(q.options[letter])}" means</div>
            <div class="explanation-text">${renderInline(q.feedback[letter])}</div>
          </div>
        `;
      }
      if (q.explanation) {
        explanationHtml += `
          <div class="explanation-card">
            <div class="explanation-label">💬 Explanation</div>
            <div class="explanation-text">${renderInline(q.explanation)}</div>
          </div>
        `;
      }
      document.getElementById("explanation-box").innerHTML = explanationHtml;

      document.getElementById("next-btn").disabled = false;
    }

    function nextQuestion() {
      if (!answered) return;
      if (current < questions.length - 1) {
        current++;
        renderQuestion();
      } else {
        renderResults();
      }
    }

    function renderResults() {
      const total = questions.length;
      const pct = Math.round((score / total) * 100);
      root.innerHTML = `
        <div class="results-card">
          <div>🎉 Quiz Complete!</div>
          <div class="results-quiz-name">${escapeHtml(quizName)}</div>
          <div class="score-big">${score} / ${total}</div>
          <div>Accuracy ${pct}%</div>
          <div class="results-actions">
            <button class="btn-primary" id="retry-btn">🔄 Retry Quiz</button>
            <a class="btn-secondary" href="index.html">📚 Back to Quiz List</a>
          </div>
        </div>
      `;
      document.getElementById("retry-btn").addEventListener("click", () => {
        current = 0;
        score = 0;
        renderQuestion();
      });
    }

    init();
  </script>
</body>
</html>
