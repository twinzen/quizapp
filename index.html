<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Quiz Center</title>
  <link rel="stylesheet" href="style.css?v=4" />
</head>
<body>
  <div class="page">
    <div class="list-header">
      <h1>📚 Quiz Center</h1>
      <p>Choose a quiz to start the challenge</p>
    </div>

    <div id="main-tabs" class="quiz-tabs main-tabs"></div>

    <div id="quizzes-view">
      <div id="quiz-tabs" class="quiz-tabs"></div>

      <div id="quiz-grid" class="quiz-grid">
        <div class="loading">Loading quiz list…</div>
      </div>
    </div>

    <div id="reports-view" class="hidden">
      <div id="report-tabs" class="quiz-tabs"></div>

      <div id="reports-grid" class="quiz-grid">
        <div class="loading">Loading report list…</div>
      </div>
    </div>

    <div id="dictionary-view" class="hidden">
      <div id="dictionary-list">
        <div class="loading">Loading dictionary…</div>
      </div>
    </div>
  </div>

  <script src="app.js?v=10"></script>
  <script>
    const CATEGORIES = ["English", "Math", "Problem Solving"];
    const MAIN_TABS = ["Quizzes", "Writing Reports", "Dictionary"];
    const MAIN_VIEWS = {
      "Quizzes": "quizzes-view",
      "Writing Reports": "reports-view",
      "Dictionary": "dictionary-view",
    };
    let manifest = [];
    let reportManifest = [];
    let reportWriters = [];
    let activeWriter = null;
    let dictionaryIndex = null;
    let activeCategory = CATEGORIES[0];
    let activeMainTab = MAIN_TABS[0];

    function renderMainTabs() {
      const tabsEl = document.getElementById("main-tabs");
      tabsEl.innerHTML = "";
      for (const tab of MAIN_TABS) {
        const btn = document.createElement("button");
        btn.type = "button";
        btn.className = "tab-btn" + (tab === activeMainTab ? " active" : "");
        btn.textContent = tab;
        btn.addEventListener("click", () => {
          if (activeMainTab === tab) return;
          activeMainTab = tab;
          renderMainTabs();
          switchMainView();
        });
        tabsEl.appendChild(btn);
      }
    }

    function switchMainView() {
      for (const [tab, viewId] of Object.entries(MAIN_VIEWS)) {
        document.getElementById(viewId).classList.toggle("hidden", tab !== activeMainTab);
      }
      if (activeMainTab === "Writing Reports" && !reportManifest.length) loadReportList();
      if (activeMainTab === "Dictionary" && !dictionaryIndex) loadDictionaryList();
    }

    async function loadDictionaryList() {
      const list = document.getElementById("dictionary-list");
      try {
        const res = await fetch("dictionary.json", { cache: "no-store" });
        if (!res.ok) throw new Error("HTTP " + res.status);
        dictionaryIndex = await res.json();
      } catch (err) {
        list.innerHTML = `<div class="error-state">
          Failed to load dictionary (dictionary.json).<br />
          Make sure this page is opened via a local server (not by double-clicking index.html directly).
        </div>`;
        return;
      }

      const categories = dictionaryIndex.categories || [];
      if (!categories.length) {
        list.innerHTML = `<div class="empty-state">No dictionary categories available yet.</div>`;
        return;
      }

      list.innerHTML = "";
      for (const category of categories) {
        const section = document.createElement("div");
        section.className = "dict-category";
        section.innerHTML = `<h2>${escapeHtml(category.name)}</h2>`;

        const topics = category.topics || [];
        if (!topics.length) {
          section.insertAdjacentHTML("beforeend", `<p class="dict-none">No topics yet.</p>`);
        } else {
          const grid = document.createElement("div");
          grid.className = "quiz-grid";
          for (const topic of topics) grid.appendChild(renderTopicCard(topic));
          section.appendChild(grid);
        }
        list.appendChild(section);
      }
    }

    function renderTopicCard(topic) {
      const card = document.createElement("div");
      card.className = "quiz-card";
      card.innerHTML = `
        <div class="info">
          <h2>${escapeHtml(topic.name)}</h2>
          <div class="count">Loading…</div>
        </div>
        <a class="start-btn" href="dictionary.html?file=${encodeURIComponent(topic.file)}">Open</a>
      `;

      // Fetch just to show what's inside the topic; failures are non-fatal here.
      const countEl = card.querySelector(".count");
      fetch(topic.file, { cache: "no-store" })
        .then((res) => {
          if (!res.ok) throw new Error("HTTP " + res.status);
          return res.json();
        })
        .then((data) => {
          const sizeOf = (group) => Object.values(group || {}).reduce((sum, list) => sum + list.length, 0);
          countEl.textContent =
            `${sizeOf(data.words)} words · ${sizeOf(data.phrases)} phrases · ${(data.sentences || []).length} sentences`;
        })
        .catch(() => {
          countEl.textContent = "Failed to load topic";
        });

      return card;
    }

    async function loadReportList() {
      const grid = document.getElementById("reports-grid");
      try {
        const res = await fetch("reports.json", { cache: "no-store" });
        if (!res.ok) throw new Error("HTTP " + res.status);
        reportManifest = await res.json();
      } catch (err) {
        grid.innerHTML = `<div class="error-state">
          Failed to load report list (reports.json).<br />
          Make sure this page is opened via a local server (not by double-clicking index.html directly).
        </div>`;
        return;
      }

      if (!reportManifest.length) {
        grid.innerHTML = `<div class="empty-state">No writing reports available yet.</div>`;
        return;
      }

      // Writers appear as sub tabs in the order they first show up in reports.json.
      reportWriters = [...new Set(reportManifest.map(reportWriterOf))];
      activeWriter = reportWriters[0];
      renderReportTabs();
      renderReportGrid();
    }

    function reportWriterOf(report) {
      return report.writtenBy || "Unknown";
    }

    function renderReportTabs() {
      const tabsEl = document.getElementById("report-tabs");
      tabsEl.innerHTML = "";
      for (const writer of reportWriters) {
        const btn = document.createElement("button");
        btn.type = "button";
        btn.className = "tab-btn" + (writer === activeWriter ? " active" : "");
        btn.textContent = writer;
        btn.addEventListener("click", () => {
          if (activeWriter === writer) return;
          activeWriter = writer;
          renderReportTabs();
          renderReportGrid();
        });
        tabsEl.appendChild(btn);
      }
    }

    function renderReportGrid() {
      const grid = document.getElementById("reports-grid");
      const reports = reportManifest.filter((report) => reportWriterOf(report) === activeWriter);

      grid.innerHTML = "";
      for (const report of reports) {
        const card = document.createElement("div");
        card.className = "quiz-card";
        const name = report.name || reportDisplayNameFromFile(report.file);
        card.innerHTML = `
          <div class="info">
            <h2>${escapeHtml(name)}</h2>
            <p>${escapeHtml(report.date || "")}</p>
            ${report.year ? `<div class="count">Year ${escapeHtml(String(report.year))}</div>` : ""}
          </div>
          <a class="start-btn" href="report.html?file=${encodeURIComponent(report.file)}">View Report</a>
        `;
        grid.appendChild(card);
      }
    }

    async function loadQuizList() {
      const grid = document.getElementById("quiz-grid");
      try {
        const res = await fetch("quizzes.json", { cache: "no-store" });
        if (!res.ok) throw new Error("HTTP " + res.status);
        manifest = await res.json();
      } catch (err) {
        grid.innerHTML = `<div class="error-state">
          Failed to load quiz list (quizzes.json).<br />
          Make sure this page is opened via a local server (not by double-clicking index.html directly).
        </div>`;
        return;
      }

      if (!manifest.length) {
        grid.innerHTML = `<div class="empty-state">No quizzes available right now.</div>`;
        return;
      }

      renderTabs();
      renderGrid();
    }

    function renderTabs() {
      const tabsEl = document.getElementById("quiz-tabs");
      tabsEl.innerHTML = "";
      for (const category of CATEGORIES) {
        const btn = document.createElement("button");
        btn.type = "button";
        btn.className = "tab-btn" + (category === activeCategory ? " active" : "");
        btn.textContent = category;
        btn.addEventListener("click", () => {
          if (activeCategory === category) return;
          activeCategory = category;
          renderTabs();
          renderGrid();
        });
        tabsEl.appendChild(btn);
      }
    }

    function renderGrid() {
      const grid = document.getElementById("quiz-grid");
      const quizzes = manifest.filter((quiz) => (quiz.category || "English") === activeCategory);

      if (!quizzes.length) {
        grid.innerHTML = `<div class="empty-state">No quizzes in this category yet.</div>`;
        return;
      }

      grid.innerHTML = "";
      for (const quiz of quizzes) {
        const card = document.createElement("div");
        card.className = "quiz-card";
        const name = quiz.name || quizDisplayNameFromFile(quiz.file);
        card.innerHTML = `
          <div class="info">
            <h2>${escapeHtml(name)}</h2>
            <p>${escapeHtml(quiz.description || "")}</p>
            <div class="count" data-count-for="${escapeHtml(quiz.file)}">Loading question count…</div>
          </div>
          <a class="start-btn" href="quiz.html?file=${encodeURIComponent(quiz.file)}">Start Quiz</a>
        `;
        grid.appendChild(card);

        // Fetch just to show the question count; failures are non-fatal here.
        fetchQuizBank(quiz.file)
          .then((questions) => {
            const el = card.querySelector(`[data-count-for="${CSS.escape(quiz.file)}"]`);
            const count = quiz.number_of_questions
              ? Math.min(quiz.number_of_questions, questions.length)
              : questions.length;
            if (el) el.textContent = `${count} questions`;
          })
          .catch(() => {
            const el = card.querySelector(`[data-count-for="${CSS.escape(quiz.file)}"]`);
            if (el) el.textContent = "Failed to load question bank";
          });
      }
    }

    // dictionary.html links back here with #dictionary to reopen its tab.
    if (window.location.hash === "#dictionary") activeMainTab = "Dictionary";

    renderMainTabs();
    switchMainView();
    loadQuizList();
  </script>
</body>
</html>
