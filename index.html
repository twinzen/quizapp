<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Quiz Center</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="page">
    <div class="list-header">
      <h1>📚 Quiz Center</h1>
      <p>Choose a quiz to start the challenge</p>
    </div>

    <div id="main-tabs" class="quiz-tabs main-tabs"></div>

    <div id="quizzes-view">
      <div id="quiz-tabs" class="quiz-tabs"></div>

      <div id="quiz-grid" class="quiz-grid">
        <div class="loading">Loading quiz list…</div>
      </div>
    </div>

    <div id="reports-view" class="hidden">
      <div id="reports-grid" class="quiz-grid">
        <div class="loading">Loading report list…</div>
      </div>
    </div>
  </div>

  <script src="app.js?v=10"></script>
  <script>
    const CATEGORIES = ["English", "Math", "Problem Solving"];
    const MAIN_TABS = ["Quizzes", "Writing Reports"];
    let manifest = [];
    let reportManifest = [];
    let activeCategory = CATEGORIES[0];
    let activeMainTab = MAIN_TABS[0];

    function renderMainTabs() {
      const tabsEl = document.getElementById("main-tabs");
      tabsEl.innerHTML = "";
      for (const tab of MAIN_TABS) {
        const btn = document.createElement("button");
        btn.type = "button";
        btn.className = "tab-btn" + (tab === activeMainTab ? " active" : "");
        btn.textContent = tab;
        btn.addEventListener("click", () => {
          if (activeMainTab === tab) return;
          activeMainTab = tab;
          renderMainTabs();
          switchMainView();
        });
        tabsEl.appendChild(btn);
      }
    }

    function switchMainView() {
      const quizzesView = document.getElementById("quizzes-view");
      const reportsView = document.getElementById("reports-view");
      if (activeMainTab === "Quizzes") {
        quizzesView.classList.remove("hidden");
        reportsView.classList.add("hidden");
      } else {
        quizzesView.classList.add("hidden");
        reportsView.classList.remove("hidden");
        if (!reportManifest.length) loadReportList();
      }
    }

    async function loadReportList() {
      const grid = document.getElementById("reports-grid");
      try {
        const res = await fetch("reports.json", { cache: "no-store" });
        if (!res.ok) throw new Error("HTTP " + res.status);
        reportManifest = await res.json();
      } catch (err) {
        grid.innerHTML = `<div class="error-state">
          Failed to load report list (reports.json).<br />
          Make sure this page is opened via a local server (not by double-clicking index.html directly).
        </div>`;
        return;
      }

      if (!reportManifest.length) {
        grid.innerHTML = `<div class="empty-state">No writing reports available yet.</div>`;
        return;
      }

      grid.innerHTML = "";
      for (const report of reportManifest) {
        const card = document.createElement("div");
        card.className = "quiz-card";
        const name = report.name || reportDisplayNameFromFile(report.file);
        card.innerHTML = `
          <div class="info">
            <h2>${escapeHtml(name)}</h2>
            <p>${escapeHtml(report.date || "")}</p>
            ${report.writtenBy ? `<div class="count">Written by ${escapeHtml(report.writtenBy)}${report.year ? ` (Year ${escapeHtml(String(report.year))})` : ""}</div>` : ""}
          </div>
          <a class="start-btn" href="report.html?file=${encodeURIComponent(report.file)}">View Report</a>
        `;
        grid.appendChild(card);
      }
    }

    async function loadQuizList() {
      const grid = document.getElementById("quiz-grid");
      try {
        const res = await fetch("quizzes.json", { cache: "no-store" });
        if (!res.ok) throw new Error("HTTP " + res.status);
        manifest = await res.json();
      } catch (err) {
        grid.innerHTML = `<div class="error-state">
          Failed to load quiz list (quizzes.json).<br />
          Make sure this page is opened via a local server (not by double-clicking index.html directly).
        </div>`;
        return;
      }

      if (!manifest.length) {
        grid.innerHTML = `<div class="empty-state">No quizzes available right now.</div>`;
        return;
      }

      renderTabs();
      renderGrid();
    }

    function renderTabs() {
      const tabsEl = document.getElementById("quiz-tabs");
      tabsEl.innerHTML = "";
      for (const category of CATEGORIES) {
        const btn = document.createElement("button");
        btn.type = "button";
        btn.className = "tab-btn" + (category === activeCategory ? " active" : "");
        btn.textContent = category;
        btn.addEventListener("click", () => {
          if (activeCategory === category) return;
          activeCategory = category;
          renderTabs();
          renderGrid();
        });
        tabsEl.appendChild(btn);
      }
    }

    function renderGrid() {
      const grid = document.getElementById("quiz-grid");
      const quizzes = manifest.filter((quiz) => (quiz.category || "English") === activeCategory);

      if (!quizzes.length) {
        grid.innerHTML = `<div class="empty-state">No quizzes in this category yet.</div>`;
        return;
      }

      grid.innerHTML = "";
      for (const quiz of quizzes) {
        const card = document.createElement("div");
        card.className = "quiz-card";
        const name = quiz.name || quizDisplayNameFromFile(quiz.file);
        card.innerHTML = `
          <div class="info">
            <h2>${escapeHtml(name)}</h2>
            <p>${escapeHtml(quiz.description || "")}</p>
            <div class="count" data-count-for="${escapeHtml(quiz.file)}">Loading question count…</div>
          </div>
          <a class="start-btn" href="quiz.html?file=${encodeURIComponent(quiz.file)}">Start Quiz</a>
        `;
        grid.appendChild(card);

        // Fetch just to show the question count; failures are non-fatal here.
        fetchQuizBank(quiz.file)
          .then((questions) => {
            const el = card.querySelector(`[data-count-for="${CSS.escape(quiz.file)}"]`);
            const count = quiz.number_of_questions
              ? Math.min(quiz.number_of_questions, questions.length)
              : questions.length;
            if (el) el.textContent = `${count} questions`;
          })
          .catch(() => {
            const el = card.querySelector(`[data-count-for="${CSS.escape(quiz.file)}"]`);
            if (el) el.textContent = "Failed to load question bank";
          });
      }
    }

    renderMainTabs();
    loadQuizList();
  </script>
</body>
</html>
